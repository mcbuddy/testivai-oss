name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build, Test, Pack (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v6

      # Setup pnpm BEFORE setup-node so setup-node's pnpm cache can find it.
      # No `version:` — pnpm/action-setup@v6 reads it from the
      # `packageManager` field in package.json (currently "pnpm@10.0.0").
      # Specifying both errors out: ERR_PNPM_BAD_PM_VERSION.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build GitHub Action
        run: pnpm --filter testivai-action run build

      # The Action is consumed at runtime via `uses: <repo>@<ref>` and runs
      # the bundled action/dist/index.js. The committed dist/ MUST stay in
      # sync with src/. This guard fails if a PR changed src/ but forgot
      # to rebuild + commit the dist/. Restricted to a single matrix cell
      # so we don't fight ourselves on cross-OS line endings.
      - name: Verify action/dist is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: |
          if ! git diff --exit-code -- action/dist/; then
            echo "::error::action/dist/ is out of sync with src/. Run \`cd action && npm run build\` and commit the result."
            git --no-pager diff --stat -- action/dist/
            exit 1
          fi

      # The element-map collector is injected by every adapter, and its output
      # is compared across runs — and across LANGUAGES, since all adapters
      # share one .testivai/baselines/ directory. Python and Java cannot
      # import the TypeScript source, so they ship a generated copy. If those
      # copies drift, two languages emit different maps for the same page and
      # the diff looks like a real regression. This guard makes that
      # impossible to merge unnoticed.
      - name: Verify generated element-map assets are up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: |
          node scripts/generate-element-map-asset.js --check || {
            echo "::error::Generated element-map assets are stale. Run \`pnpm build && node scripts/generate-element-map-asset.js\` and commit the result."
            exit 1
          }

      - name: Run unit tests
        run: pnpm test

      - name: Validate publish surfaces (npm pack --dry-run)
        run: pnpm pack:dry

      - name: Run OSS smoke E2E
        run: pnpm e2e

  python-adapter:
    name: Python adapter (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test
        working-directory: python
        run: |
          pip install -e . pytest
          pytest tests/ -q

  ruby-adapter:
    name: Ruby adapter (RSpec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: ruby
      # The specs execute the generated element-map collector through Node
      # against a duck-typed DOM, so Node must be present.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and test
        working-directory: ruby
        run: |
          gem install rspec -v '~> 3.13' --no-document
          rspec

  java-adapter:
    name: Java adapter (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: java
        run: mvn -B --no-transfer-progress test
