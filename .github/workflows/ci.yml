name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build, Test, Pack (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      # Run all matrix cells even if one fails, so we see the full picture
      # in the PR check rather than stopping at the first red cell.
      # Windows is intentionally excluded for now — revisit once the OSS
      # surface is stable on macOS + Linux.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v6

      # Setup pnpm BEFORE setup-node so setup-node's pnpm cache can find it.
      # No `version:` — pnpm/action-setup@v4 reads it from the
      # `packageManager` field in package.json (currently "pnpm@10.0.0").
      # Specifying both errors out: ERR_PNPM_BAD_PM_VERSION.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build GitHub Action
        run: pnpm --filter testivai-action run build

      # The Action is consumed at runtime via `uses: <repo>@<ref>` and runs
      # the bundled action/dist/index.js. The committed dist/ MUST stay in
      # sync with src/. This guard fails if a PR changed src/ but forgot
      # to rebuild + commit the dist/. Restricted to a single matrix cell
      # so we don't fight ourselves on cross-OS line endings.
      - name: Verify action/dist/ is up-to-date
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: |
          if ! git diff --quiet -- action/dist/; then
            echo "::error::action/dist/ is out of sync with src/. Run \`pnpm --filter testivai-action run build\` and commit the result."
            git --no-pager diff --stat -- action/dist/
            exit 1
          fi

      - name: Run unit tests
        run: pnpm test

      - name: Validate publish surfaces (npm pack --dry-run)
        run: pnpm pack:dry

      - name: Run OSS smoke E2E
        run: pnpm e2e
