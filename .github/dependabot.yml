# Dependabot configuration for testivai-oss
#
# Keeps npm dependencies and GitHub Actions up to date weekly.
# Groups patch + minor updates together to reduce PR churn; major
# updates land as individual PRs because they may need attention.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Root workspace (covers all packages via pnpm workspace)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Bundle non-major updates so we get one PR per ecosystem instead of N
      npm-non-major:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # inquirer >=9 is ESM-only (ships raw TypeScript source, drops rxjs CJS).
      # Requires Jest ESM migration before upgrading. Revisit when codebase
      # moves to native ESM.
      - dependency-name: "inquirer"
        versions: [">=9.0.0"]
      # commander >=15 is ESM-only (no require entry in exports). v14 has dual
      # CJS+ESM and is the current target. Unblock when Jest ESM migration done.
      - dependency-name: "commander"
        versions: [">=15.0.0"]

  # GitHub Action source (action/dist must be rebuilt; surface major bumps)
  - package-ecosystem: "npm"
    directory: "/action"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-action"
    commit-message:
      prefix: "chore(deps,action)"
      include: "scope"
    groups:
      action-non-major:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @actions/core >=3 and @actions/artifact >=3 are ESM-only (no "require"
      # condition in package exports). ncc (CJS bundler) cannot resolve them.
      # Unblock when action bundler is migrated from ncc to esbuild.
      - dependency-name: "@actions/core"
        versions: [">=3.0.0"]
      - dependency-name: "@actions/artifact"
        versions: [">=3.0.0"]

  # GitHub Actions used in our workflows (CI, release, codeql)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
